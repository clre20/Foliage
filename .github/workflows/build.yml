name: Build Foliage

# main: latest development, builds and uploads an artifact only.
# Version branches (named after the Minecraft version, e.g. 26.3): every push
# builds and publishes a GitHub Release tagged v<mc>-<build>,
# with the jar Foliage-<mc>-<build>.jar.

on:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read versions
        id: ver
        run: |
          mc=$(grep -E '^mcVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          build=${{ github.run_number }}
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "jar=Foliage-$mc-$build.jar" >> "$GITHUB_OUTPUT"
          echo "tag=v$mc-$build" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "$mc" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyAllPatches --stacktrace

      - name: Build paperclip jar
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: ./gradlew :foliage-server:createPaperclipJar --stacktrace

      - name: Collect jar
        run: |
          mkdir -p dist
          cp foliage-server/build/libs/foliage-paperclip-*.jar "dist/${{ steps.ver.outputs.jar }}"
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.jar }}
          path: dist/${{ steps.ver.outputs.jar }}

      - name: Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "dist/${{ steps.ver.outputs.jar }}" \
            --target "${{ github.sha }}" \
            --title "Foliage ${{ steps.ver.outputs.mc }} build ${{ steps.ver.outputs.build }}" \
            --generate-notes
